# =============================================================================
# docker-compose.yml — NYTimes News Scraper
# =============================================================================
#
# Pré-requisitos:
#   - Docker Desktop com WSL2 habilitado, ou Docker Engine no Ubuntu/WSL2
#   - Editar config/config.yaml antes de executar
#
# Uso rápido:
#   docker compose up                # Baixa a imagem do GHCR e executa
#   docker compose up --build        # Faz build local em vez de usar o GHCR
#   docker compose run --rm scraper python validate.py   # Roda testes
#
# Após execução, os resultados estarão em:
#   ./output/news_results.xlsx
#   ./output/images/
#   ./logs/scraper.log
# =============================================================================

version: "3.9"

services:
  scraper:
    image: ghcr.io/egameiro/desafioone4tech:latest
    container_name: nytimes-scraper

    volumes:
      # Resultados persistem no host após o container ser removido
      - ./output:/app/output
      - ./logs:/app/logs
      # Config montada como volume — edite sem precisar rebuild
      - ./config/config.yaml:/app/config/config.yaml:ro

    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

    # Container é removido automaticamente após execução bem-sucedida
    # Remova ou comente para manter o container após a execução (debug)
    restart: "no"

    # Limites de recursos (opcional — ajuste conforme sua máquina)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2g
    #       cpus: "1.0"
